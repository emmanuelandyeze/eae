<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- EAE Haute-Couture Monogram Emblem: Pure Master Mark -->
  <defs>
    <linearGradient id="eaeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B5" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#EDD59E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Central Apex of 'A' with Crown Finial -->
    <path d="M 250 65 L 180 230 C 170 255 155 270 130 280" 
          stroke="url(#eaeGoldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 65 L 320 230 C 330 255 345 270 370 280" 
          stroke="url(#eaeGoldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Apex Spire Accent -->
    <circle cx="250" cy="50" r="4.5" fill="url(#eaeGoldGrad)" />

    <!-- Left 'E' Fluid Sculptural Ribbons -->
    <!-- Top Arc of Left E -->
    <path d="M 235 110 C 175 90 120 120 120 170 C 120 210 160 225 210 215" 
          stroke="url(#eaeGoldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Bottom Sweeping Loop of Left E -->
    <path d="M 205 215 C 145 220 110 255 110 305 C 110 365 175 390 240 345 C 248 340 250 330 250 320" 
          stroke="url(#eaeGoldGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Right 'E' Fluid Sculptural Ribbons (Interlocking Reflection) -->
    <!-- Top Arc of Right E -->
    <path d="M 265 110 C 325 90 380 120 380 170 C 380 210 340 225 290 215" 
          stroke="url(#eaeGoldGrad)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Bottom Sweeping Loop of Right E -->
    <path d="M 295 215 C 355 220 390 255 390 305 C 390 365 325 390 260 345 C 252 340 250 330 250 320" 
          stroke="url(#eaeGoldGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Interlocking Center Ligature (A Crossbar & Central Knot) -->
    <path d="M 195 215 C 220 205 280 205 305 215" 
          stroke="url(#eaeGoldGrad)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="250" cy="215" rx="8" ry="12" 
             stroke="url(#eaeGoldGrad)" stroke-width="3.5" fill="none"/>
    
    <!-- Base Anchor Flourish -->
    <path d="M 220 375 C 235 385 265 385 280 375" 
          stroke="url(#eaeGoldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
