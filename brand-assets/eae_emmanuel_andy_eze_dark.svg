<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%" fill="none">
  <!-- EAE Emmanuel Andy Eze - Dark Theme Primary Lockup -->
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0D1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3DC9B" />
    </linearGradient>
  </defs>

  <!-- Monogram Mark -->
  <g transform="translate(50, 40)">
    <!-- Central Apex of 'A' -->
    <path d="M 250 65 L 180 230 C 170 255 155 270 130 280" 
          stroke="url(#goldGradDark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 65 L 320 230 C 330 255 345 270 370 280" 
          stroke="url(#goldGradDark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Apex Accent -->
    <circle cx="250" cy="50" r="4.5" fill="url(#goldGradDark)" />

    <!-- Left 'E' Ribbons -->
    <path d="M 235 110 C 175 90 120 120 120 170 C 120 210 160 225 210 215" 
          stroke="url(#goldGradDark)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 205 215 C 145 220 110 255 110 305 C 110 365 175 390 240 345 C 248 340 250 330 250 320" 
          stroke="url(#goldGradDark)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Right 'E' Ribbons -->
    <path d="M 265 110 C 325 90 380 120 380 170 C 380 210 340 225 290 215" 
          stroke="url(#goldGradDark)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 295 215 C 355 220 390 255 390 305 C 390 365 325 390 260 345 C 252 340 250 330 250 320" 
          stroke="url(#goldGradDark)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Central Interlocking Knot -->
    <path d="M 195 215 C 220 205 280 205 305 215" 
          stroke="url(#goldGradDark)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="250" cy="215" rx="8" ry="12" 
             stroke="url(#goldGradDark)" stroke-width="3.5" fill="none"/>

    <!-- Base Anchor Flourish -->
    <path d="M 220 375 C 235 385 265 385 280 375" 
          stroke="url(#goldGradDark)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typographic Lockup -->
  <!-- Name Subtitle -->
  <text x="300" y="520" text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', 'Trajan Pro', 'Didot', 'Times New Roman', serif" 
        font-size="24" font-weight="500" letter-spacing="0.36em" 
        fill="#F4F1EA">
    EMMANUEL ANDY EZE
  </text>

  <!-- Refined Hairline Accent Rule -->
  <line x1="220" y1="550" x2="380" y2="550" stroke="url(#goldGradDark)" stroke-width="1.2" opacity="0.6"/>

  <!-- Atelier / Signature Descriptor -->
  <text x="300" y="582" text-anchor="middle" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="11" font-weight="600" letter-spacing="0.48em" 
        fill="#A39F93">
    SIGNATURE ATELIER
  </text>
</svg>
