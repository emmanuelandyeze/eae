<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%" fill="none">
  <!-- EAE Emmanuel Andy Eze - Official Roman Serif Lockup (Dark Theme) -->
  <defs>
    <filter id="subtleDeboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="-0.5" dy="-0.5" stdDeviation="0.5" flood-color="#FFFFFF" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Centered EAE Monogram -->
  <g transform="translate(20, -10)" fill="#EDE8DF" filter="url(#subtleDeboss)">
    <!-- LEFT 'E' -->
    <path d="M 160 100 L 195 100 L 195 280 L 160 280 L 160 268 L 170 268 L 170 112 L 160 112 Z"/>
    <path d="M 185 100 L 255 100 L 255 132 L 242 132 L 240 114 L 195 114 L 195 100 Z"/>
    <path d="M 185 180 L 240 180 L 240 195 L 230 195 L 228 189 L 195 189 L 195 180 Z"/>
    <path d="M 170 266 L 265 266 L 265 245 L 277 245 L 277 280 L 170 280 Z"/>

    <!-- CENTER 'A' -->
    <path d="M 300 100 L 342 100 L 342 107 L 332 107 L 310 107 L 300 107 Z"/>
    <path d="M 316 105 L 334 105 L 248 280 L 222 280 L 222 272 L 234 272 Z"/>
    <path d="M 326 105 L 340 105 L 408 272 L 418 272 L 418 280 L 388 280 L 388 272 L 395 272 Z"/>
    <path d="M 272 216 L 370 216 L 370 224 L 268 224 Z"/>

    <!-- RIGHT 'E' -->
    <path d="M 344 122 L 425 122 L 425 154 L 412 154 L 410 135 L 350 135 Z"/>
    <path d="M 373 194 L 420 194 L 420 210 L 410 210 L 408 203 L 377 203 Z"/>
    <path d="M 394 256 L 440 256 L 440 280 L 384 280 L 384 266 L 428 266 L 428 240 L 440 240 L 440 280 Z"/>
  </g>

  <!-- Typography Subtitle -->
  <text x="320" y="360" text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', 'Trajan Pro', 'Didot', 'Times New Roman', serif" 
        font-size="20" font-weight="600" letter-spacing="0.38em" 
        fill="#EDE8DF" filter="url(#subtleDeboss)">
    EMMANUEL ANDY EZE
  </text>

  <!-- Minimalist Baseline Accent -->
  <line x1="250" y1="388" x2="390" y2="388" stroke="#D4AF37" stroke-width="1.2" opacity="0.65"/>
</svg>
